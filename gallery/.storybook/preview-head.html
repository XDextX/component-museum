<style>
  /* Spec 007, RF-7: wide content scrolls inside itself instead of widening the page. */
  /* The usage code is a grid item of the Astro story: min-width:0 lets the grid shrink below it. */
  #storybook-root section {
    min-width: 0;
  }
  #storybook-root pre {
    max-width: 100%;
    overflow-x: auto;
  }
  /* Long custom property names in the docs prose have no break point of their own. */
  .sbdocs-content li code,
  .sbdocs-content p code {
    overflow-wrap: anywhere;
    white-space: normal;
  }
  /* The props table of the docs page is about 547 px wide at its narrowest. */
  .docblock-argstable {
    display: block;
    max-width: 100%;
    overflow-x: auto;
  }
  /* Spec 008, RF-1: the story view is painted whole by the decorator's surface, with no 16 px frame. */
  body.sb-show-main.sb-main-padded {
    padding: 0;
  }
  #storybook-root > div {
    box-sizing: border-box;
    min-height: 100vh;
  }
  /* Spec 008, RF-2: the root (and so every scrollbar) follows the gallery theme; "system" sets no attribute. */
  /* Only the decorator and the docs container count: a docs page may hold stories pinned to the other theme. */
  :root {
    color-scheme: light dark;
  }
  :root:has(#storybook-root > [data-theme="light"], [data-docs-scheme="light"]) {
    color-scheme: light;
  }
  :root:has(#storybook-root > [data-theme="dark"], [data-docs-scheme="dark"]) {
    color-scheme: dark;
  }
</style>
